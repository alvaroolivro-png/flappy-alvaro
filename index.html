<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flappy Alvaro">
<meta name="theme-color" content="#8a6a4c">
<title>Flappy Alvaro</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#1c1410; overflow:hidden; user-select:none; -webkit-user-select:none; }
  body { display:flex; align-items:center; justify-content:center; }
  canvas { display:block; touch-action:none; cursor:pointer; }
</style>
</head>
<body>
<canvas id="game" width="400" height="640"></canvas>
<script>
window.__errs = [];
window.onerror = function(msg, src, line){ window.__errs.push(msg + ' @' + line); };
</script>
<script>
(() => {
'use strict';
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const W = 400, H = 640, GROUND_H = 84, GY = H - GROUND_H;
const PW = 64;               // pipe width

// ---------- background: Alvaro's book cover ----------
const bookImg = new Image();
bookImg.src = 'book.jpg';

// ---------- responsive scaling ----------
function fit(){
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cvs.style.width  = Math.floor(W * s) + 'px';
  cvs.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fit); fit();

// ---------- constants ----------
const GRAV = 0.42, FLAP = -8.4, MAXFALL = 11;
const speed = () => 2.7 + Math.min(score * 0.045, 1.3);
const gapOf = () => Math.max(170 - score * 1.4, 134);

// ---------- state ----------
const READY = 'ready', PLAY = 'playing', OVER = 'over';
let state = READY;
let frames = 0, score = 0, best = 0, newBest = false;
try { best = parseInt(localStorage.getItem('flappyAlvaroBest') || '0', 10) || 0; } catch(e){}

const guy = { x: 110, y: GY / 2 - 40, vy: 0, rot: 0, r: 18, flapT: 0, landed: false };
let pipes = [], parts = [];
let scroll = 0, flash = 0, shake = 0, scoreFlash = 0, overT = 0;

// ---------- audio (WebAudio blips, no assets) ----------
let AC = null;
function audioInit(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f0, f1, dur, type, vol, delay){
  if (!AC) return;
  const t = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
const sFlap  = () => tone(500, 800, 0.09, 'triangle', 0.12);
const sScore = () => { tone(988, 988, 0.07, 'square', 0.05); tone(1319, 1319, 0.09, 'square', 0.05, 0.08); };
const sHit   = () => { tone(300, 60, 0.30, 'sawtooth', 0.16); tone(160, 40, 0.22, 'square', 0.10, 0.05); };
const sThud  = () => tone(130, 45, 0.16, 'sine', 0.2);

// ---------- helpers ----------
function rr(x, y, w, h, r){
  ctx.beginPath();
  if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circRect(cx, cy, r, rx, ry, rw, rh){
  const nx = Math.max(rx, Math.min(cx, rx + rw));
  const ny = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < r * r;
}
function addDust(x, y, n, col){
  for (let i = 0; i < n; i++) parts.push({
    x: x + (Math.random() - 0.5) * 26, y: y + (Math.random() - 0.5) * 6,
    vx: (Math.random() - 0.5) * 3.2, vy: -Math.random() * 2.6,
    life: 1, c: col || '#c9a56b', r: 2 + Math.random() * 3
  });
}

// ---------- game flow ----------
function newPipe(){
  const gap = gapOf();
  const top = 70 + Math.random() * (GY - 140 - gap);
  return { x: W + 40, top: top, gap: gap, passed: false };
}
function flap(){
  guy.vy = FLAP; guy.flapT = 1; sFlap();
  for (let i = 0; i < 3; i++) parts.push({
    x: guy.x - 16, y: guy.y + 8 + Math.random() * 10,
    vx: -2 - Math.random() * 1.6, vy: 0.4 + Math.random(),
    life: 1, c: 'rgba(255,255,255,0.85)', r: 1.5 + Math.random() * 1.5
  });
}
function die(onGround){
  state = OVER; overT = 0; flash = 1; shake = 1; sHit();
  newBest = score > best;
  if (newBest) { best = score; try { localStorage.setItem('flappyAlvaroBest', String(best)); } catch(e){} }
  if (onGround) { guy.landed = true; addDust(guy.x, GY - 4, 10); }
  else { guy.landed = false; guy.vy = -3.4; }
}
function reset(){
  state = READY; score = 0; newBest = false;
  guy.y = GY / 2 - 40; guy.vy = 0; guy.rot = 0; guy.landed = false;
  pipes = []; overT = 0;
}
function tap(){
  audioInit();
  if (state === READY) { state = PLAY; pipes = [ { x: W + 130, top: 0, gap: 0, passed: true } ]; pipes[0] = newPipe(); pipes[0].x = W + 130; flap(); }
  else if (state === PLAY) flap();
  else if (state === OVER && overT > 25) reset();
}

// ---------- update ----------
function update(dt){
  frames += dt;
  if (state === READY || state === PLAY) scroll += (state === PLAY ? speed() : 0.7) * dt;

  if (state === READY){
    guy.y = GY / 2 - 40 + Math.sin(frames * 0.09) * 10;
    guy.rot = Math.sin(frames * 0.09) * 0.06;
  }
  if (state === PLAY){
    guy.vy = Math.min(guy.vy + GRAV * dt, MAXFALL);
    guy.y += guy.vy * dt;
    if (guy.y < -30) { guy.y = -30; guy.vy = 0; }
    const target = guy.vy < 0 ? -0.45 : Math.min(guy.vy * 0.12, 1.35);
    guy.rot += (target - guy.rot) * (guy.vy < 0 ? 0.35 : 0.08) * dt;

    const sp = speed();
    for (const p of pipes) p.x -= sp * dt;
    if (!pipes.length || pipes[pipes.length - 1].x < W - 185) pipes.push(newPipe());
    pipes = pipes.filter(p => p.x > -PW - 20);

    for (const p of pipes){
      if (!p.passed && p.x + PW < guy.x - 10){ p.passed = true; score++; scoreFlash = 1; sScore(); }
      if (circRect(guy.x, guy.y, guy.r, p.x, 0, PW, p.top) ||
          circRect(guy.x, guy.y, guy.r, p.x, p.top + p.gap, PW, GY - (p.top + p.gap))){
        die(false); break;
      }
    }
    if (state === PLAY && guy.y + guy.r >= GY) { guy.y = GY - guy.r; die(true); }
  }
  if (state === OVER){
    overT += dt;
    if (!guy.landed){
      guy.vy = Math.min(guy.vy + GRAV * 1.25 * dt, 13);
      guy.y += guy.vy * dt;
      guy.rot += (1.5 - guy.rot) * 0.12 * dt;
      if (guy.y + guy.r >= GY){
        guy.y = GY - guy.r; guy.landed = true; guy.vy = 0;
        sThud(); shake = Math.max(shake, 0.5); addDust(guy.x, GY - 4, 8);
      }
    }
  }
  guy.flapT   = Math.max(0, guy.flapT - 0.08 * dt);
  flash       = Math.max(0, flash - 0.05 * dt);
  shake       = Math.max(0, shake - 0.04 * dt);
  scoreFlash  = Math.max(0, scoreFlash - 0.04 * dt);
  for (const q of parts){ q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 0.12 * dt; q.life -= 0.03 * dt; }
  parts = parts.filter(q => q.life > 0);
}

// ---------- drawing: background (the paneled wall from the photo) ----------
function drawWall(){
  ctx.fillStyle = '#8a6a4c';
  ctx.fillRect(0, 0, W, GY);
  // Alvaro's book cover, tiled with a slow parallax scroll
  if (bookImg.complete && bookImg.naturalWidth > 0){
    const bh = GY, bw = bookImg.naturalWidth * (bh / bookImg.naturalHeight);
    const off = -((scroll * 0.25) % bw);
    for (let x = off - bw; x < W + bw; x += bw) ctx.drawImage(bookImg, x, 0, bw, bh);
    // soft shade so pipes and text stay readable
    ctx.fillStyle = 'rgba(28,18,10,0.28)';
    ctx.fillRect(0, 0, W, GY);
  } else {
  const pw = 76;
  const off = -((scroll * 0.25) % pw);
  for (let x = off - pw; x < W + pw; x += pw){
    ctx.strokeStyle = 'rgba(60,40,22,0.5)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, GY - 10); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,230,190,0.12)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + 4, 0); ctx.lineTo(x + 4, GY - 10); ctx.stroke();
  }
  }
  // baseboard
  ctx.fillStyle = '#5e422c'; ctx.fillRect(0, GY - 12, W, 12);
  ctx.fillStyle = '#74543a'; ctx.fillRect(0, GY - 12, W, 3);

  // round wall clock — frozen at 8:46, like the photo
  const per = 660;
  const cx = ((150 - scroll * 0.25) % per + per) % per - 120;
  if (cx > -70 && cx < W + 70) drawClock(cx, 128);

  // framed picture
  const fx = ((430 - scroll * 0.25) % per + per) % per - 120;
  if (fx > -70 && fx < W + 70) drawFrame(fx, 300);
}
function drawClock(x, y){
  ctx.fillStyle = '#3a3a3a'; ctx.beginPath(); ctx.arc(x, y, 26, 0, 7); ctx.fill();
  ctx.fillStyle = '#f4efe4'; ctx.beginPath(); ctx.arc(x, y, 21.5, 0, 7); ctx.fill();
  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;
  for (let i = 0; i < 12; i++){
    const a = i * Math.PI / 6;
    const r1 = i % 3 === 0 ? 14.5 : 17;
    ctx.beginPath();
    ctx.moveTo(x + Math.sin(a) * r1, y - Math.cos(a) * r1);
    ctx.lineTo(x + Math.sin(a) * 19, y - Math.cos(a) * 19);
    ctx.stroke();
  }
  const hA = ((8 + 46 / 60) / 12) * Math.PI * 2, mA = (46 / 60) * Math.PI * 2;
  ctx.lineCap = 'round';
  ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.sin(hA) * 9, y - Math.cos(hA) * 9); ctx.stroke();
  ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.sin(mA) * 15, y - Math.cos(mA) * 15); ctx.stroke();
  ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 7); ctx.fill();
}
function drawFrame(x, y){
  ctx.fillStyle = '#5a4030'; ctx.fillRect(x - 26, y - 30, 52, 62);
  ctx.strokeStyle = '#3b2a1c'; ctx.lineWidth = 3; ctx.strokeRect(x - 26, y - 30, 52, 62);
  ctx.fillStyle = '#8fb2c4'; ctx.fillRect(x - 20, y - 24, 40, 48);
  ctx.fillStyle = '#6f9a6b';
  ctx.beginPath(); ctx.moveTo(x - 20, y + 24); ctx.lineTo(x - 4, y + 2); ctx.lineTo(x + 8, y + 24); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e9d9a0'; ctx.beginPath(); ctx.arc(x + 10, y - 14, 5, 0, 7); ctx.fill();
}

// ---------- drawing: ground ----------
function drawGround(){
  ctx.fillStyle = '#a47148'; ctx.fillRect(0, GY, W, GROUND_H);
  ctx.fillStyle = '#7c5433'; ctx.fillRect(0, GY, W, 8);
  const off = -(scroll % 52);
  ctx.strokeStyle = 'rgba(60,38,20,0.45)'; ctx.lineWidth = 3;
  for (let x = off - 52; x < W + 52; x += 52){
    ctx.beginPath(); ctx.moveTo(x, GY + 8); ctx.lineTo(x, H); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,225,180,0.15)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, GY + 30); ctx.lineTo(W, GY + 30); ctx.stroke();
}

// ---------- drawing: pipes ----------
function drawPipe(p){
  const body = '#57b857', dark = '#3f8f3f', lite = '#8ad98a', edge = '#2c5e2c';
  const capH = 26;
  const bot = p.top + p.gap;
  // top pipe
  ctx.fillStyle = body; ctx.fillRect(p.x, -10, PW, p.top + 10);
  ctx.fillStyle = dark; ctx.fillRect(p.x + PW - 13, -10, 13, p.top + 10);
  ctx.fillStyle = lite; ctx.fillRect(p.x + 5, -10, 8, p.top + 10);
  ctx.fillStyle = body; ctx.fillRect(p.x - 5, p.top - capH, PW + 10, capH);
  ctx.fillStyle = dark; ctx.fillRect(p.x + PW - 8, p.top - capH, 13, capH);
  ctx.fillStyle = lite; ctx.fillRect(p.x, p.top - capH + 3, 8, capH - 6);
  ctx.strokeStyle = edge; ctx.lineWidth = 2.5;
  ctx.strokeRect(p.x - 5, p.top - capH, PW + 10, capH);
  ctx.strokeRect(p.x, -10, PW, p.top + 4);
  // bottom pipe
  ctx.fillStyle = body; ctx.fillRect(p.x, bot + capH, PW, GY - bot - capH + 10);
  ctx.fillStyle = dark; ctx.fillRect(p.x + PW - 13, bot + capH, 13, GY - bot - capH + 10);
  ctx.fillStyle = lite; ctx.fillRect(p.x + 5, bot + capH, 8, GY - bot - capH + 10);
  ctx.fillStyle = body; ctx.fillRect(p.x - 5, bot, PW + 10, capH);
  ctx.fillStyle = dark; ctx.fillRect(p.x + PW - 8, bot, 13, capH);
  ctx.fillStyle = lite; ctx.fillRect(p.x, bot + 3, 8, capH - 6);
  ctx.strokeRect(p.x - 5, bot, PW + 10, capH);
  ctx.strokeRect(p.x, bot + capH - 4, PW, GY - bot - capH + 10);
}

// ---------- drawing: the guy ----------
const SKIN = '#a5704c', SKIN_EDGE = '#5f3b28', HAIR = '#181210',
      NAVY = '#1e2c4f', NAVY_DK = '#16223d', NAVY_EDGE = '#101a30';
function drawGuy(x, y, rot){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.lineCap = 'round';

  // back arm + silver watch (left wrist, from the photo)
  ctx.strokeStyle = NAVY; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(-7, 6); ctx.lineTo(-15, 13); ctx.stroke();
  ctx.save(); ctx.translate(-14.4, 10.8); ctx.rotate(-0.45);
  ctx.fillStyle = '#aeb6c2'; ctx.fillRect(-4.6, -2.9, 9.2, 5.8);
  ctx.strokeStyle = '#5c6672'; ctx.lineWidth = 1.4; ctx.strokeRect(-4.6, -2.9, 9.2, 5.8);
  ctx.restore();
  ctx.fillStyle = SKIN; ctx.beginPath(); ctx.arc(-16, 14.8, 3.9, 0, 7); ctx.fill();

  // torso: navy hoodie
  ctx.fillStyle = NAVY;
  ctx.beginPath(); ctx.ellipse(0, 9, 18, 14.5, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = NAVY_EDGE; ctx.lineWidth = 1.6; ctx.stroke();

  // hood collar
  ctx.fillStyle = NAVY_DK;
  ctx.beginPath(); ctx.ellipse(0, -3.5, 13, 5.5, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = NAVY_EDGE; ctx.lineWidth = 1.3; ctx.stroke();

  // drawstrings
  ctx.strokeStyle = '#f2f2f2'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-3.5, 0.5); ctx.lineTo(-4.5, 9); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(3.5, 0.5); ctx.lineTo(4.5, 9); ctx.stroke();

  // head
  ctx.fillStyle = SKIN;
  ctx.beginPath(); ctx.arc(0, -16, 15.5, 0, 7); ctx.fill();
  ctx.strokeStyle = SKIN_EDGE; ctx.lineWidth = 1.5; ctx.stroke();
  // ear (left side; he faces right)
  ctx.fillStyle = SKIN; ctx.beginPath(); ctx.arc(-13.5, -15, 3.5, 0, 7); ctx.fill();
  ctx.strokeStyle = SKIN_EDGE; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(-13.5, -15, 1.6, -0.6, 1.8); ctx.stroke();
  // nose bump
  ctx.fillStyle = SKIN; ctx.beginPath(); ctx.arc(15, -12.5, 2.3, 0, 7); ctx.fill();
  ctx.strokeStyle = SKIN_EDGE; ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.arc(15, -12.5, 2.3, 2.4, 4.6); ctx.stroke();

  // curly dark hair on top
  ctx.fillStyle = HAIR;
  ctx.beginPath(); ctx.arc(0, -16, 14.6, Math.PI * 1.085, Math.PI * 1.915); ctx.fill();
  const bumps = [[200,5],[222,5.5],[243,6],[262,6],[280,5.8],[300,5.4],[320,5],[338,4.6],[352,4]];
  for (const [deg, r] of bumps){
    const a = deg * Math.PI / 180;
    ctx.beginPath(); ctx.arc(Math.cos(a) * 14.2, -16 + Math.sin(a) * 14.2, r, 0, 7); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(8, -28.5, 4.2, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(12.5, -25, 3.4, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(-12.5, -10.5, 2.6, 0, 7); ctx.fill(); // sideburn

  // brows
  ctx.strokeStyle = HAIR; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(3, -25.3); ctx.lineTo(10.5, -24.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-10, -26); ctx.lineTo(-3, -25.4); ctx.stroke();

  // glasses: thick black wayfarer
  ctx.strokeStyle = '#141414'; ctx.lineWidth = 2.2; ctx.fillStyle = 'rgba(205,232,250,0.72)';
  rr(2.5, -22.5, 9, 8, 2); ctx.fill(); ctx.stroke();
  rr(-9.5, -22.5, 8.4, 7.6, 2); ctx.fill(); ctx.stroke();
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-1.1, -18.5); ctx.lineTo(2.5, -18.5); ctx.stroke(); // bridge
  ctx.beginPath(); ctx.moveTo(-9.5, -17.5); ctx.lineTo(-13.3, -15.8); ctx.stroke(); // temple

  // eyes
  const dead = (state === OVER);
  const blink = (frames % 185) < 7 && !dead;
  if (dead){
    ctx.strokeStyle = '#141414'; ctx.lineWidth = 1.9;
    for (const ex of [8.6, -3.6]){
      ctx.beginPath();
      ctx.moveTo(ex - 2.6, -19.1); ctx.lineTo(ex + 2.6, -13.9);
      ctx.moveTo(ex + 2.6, -19.1); ctx.lineTo(ex - 2.6, -13.9);
      ctx.stroke();
    }
    ctx.fillStyle = '#3a1f14';
    ctx.beginPath(); ctx.ellipse(7, -5, 2.6, 3.2, 0, 0, 7); ctx.fill();
  } else if (blink){
    ctx.strokeStyle = '#141414'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(5.8, -16.5); ctx.lineTo(11.4, -16.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6.4, -16.5); ctx.lineTo(-0.8, -16.5); ctx.stroke();
  } else {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(8.6, -16.5, 2.8, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(-3.6, -16.5, 2.6, 0, 7); ctx.fill();
    ctx.fillStyle = '#141414';
    ctx.beginPath(); ctx.arc(9.4, -16.5, 1.4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(-2.9, -16.5, 1.3, 0, 7); ctx.fill();
  }

  // mustache + goatee
  ctx.fillStyle = HAIR;
  ctx.beginPath(); ctx.ellipse(4.4, -8.6, 3.4, 1.7, -0.12, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(9.6, -8.6, 3.2, 1.7, 0.12, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(7, -2.4, 4.1, 3, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(7, 1.1, 2.3, 0, 7); ctx.fill();

  // mouth
  if (!dead){
    ctx.strokeStyle = '#4a2415'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(7, -6.6, 3.6, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  }

  // raised arm: index finger pointing up — his signature pose
  ctx.save();
  ctx.translate(0, -guy.flapT * 5);
  ctx.strokeStyle = NAVY; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(14, -23); ctx.stroke();
  // adidas three stripes on the sleeve
  ctx.strokeStyle = '#f2f2f2'; ctx.lineWidth = 1.7;
  const ax = 8, ay = 0, dx = 6, dy = -23;
  for (const t of [0.16, 0.27, 0.38]){
    const cxp = ax + dx * t, cyp = ay + dy * t;
    ctx.beginPath();
    ctx.moveTo(cxp - 3.7, cyp - 0.97); ctx.lineTo(cxp + 3.7, cyp + 0.97);
    ctx.stroke();
  }
  ctx.fillStyle = SKIN;
  ctx.beginPath(); ctx.arc(14, -23, 4.6, 0, 7); ctx.fill(); // fist
  ctx.strokeStyle = SKIN; ctx.lineWidth = 3.4;
  ctx.beginPath(); ctx.moveTo(14, -24.5); ctx.lineTo(15.3, -32.5); ctx.stroke(); // index finger
  ctx.strokeStyle = SKIN_EDGE; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(15, -31); ctx.lineTo(15.6, -25); ctx.stroke();
  ctx.restore();

  ctx.restore();
}

// ---------- drawing: UI ----------
function drawStar(x, y, r, col, edge){
  ctx.beginPath();
  for (let i = 0; i < 10; i++){
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rr2 = i % 2 === 0 ? r : r * 0.45;
    const px = x + Math.cos(a) * rr2, py = y + Math.sin(a) * rr2;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = col; ctx.fill();
  ctx.strokeStyle = edge; ctx.lineWidth = 1.5; ctx.stroke();
}
function drawMedal(x, y, r){
  const col  = score >= 30 ? '#f6c445' : score >= 20 ? '#cdd2dc' : '#d29a6a';
  const edge = score >= 30 ? '#a87908' : score >= 20 ? '#8f96a3' : '#8a5a33';
  ctx.fillStyle = col; ctx.strokeStyle = edge; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.stroke();
  drawStar(x, y, r * 0.55, 'rgba(255,255,255,0.9)', edge);
}
function text(str, x, y, size, fill, stroke, strokeW, align){
  ctx.font = '700 ' + size + 'px "Segoe UI", system-ui, sans-serif';
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  if (stroke){ ctx.lineJoin = 'round'; ctx.strokeStyle = stroke; ctx.lineWidth = strokeW || 6; ctx.strokeText(str, x, y); }
  ctx.fillStyle = fill; ctx.fillText(str, x, y);
}

function draw(){
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 10, (Math.random() - 0.5) * shake * 10);

  drawWall();
  for (const p of pipes) drawPipe(p);
  drawGround();
  for (const q of parts){
    ctx.globalAlpha = Math.max(0, q.life);
    ctx.fillStyle = q.c;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawGuy(guy.x, guy.y, guy.rot);
  ctx.restore();

  // ---------- overlays ----------
  if (state === PLAY || state === OVER){
    const s = 1 + scoreFlash * 0.25;
    ctx.save();
    ctx.translate(W / 2, 70); ctx.scale(s, s);
    text(String(score), 0, 0, 44, '#ffffff', '#16223d', 8);
    ctx.restore();
  }
  if (state === READY){
    text('FLAPPY ALVARO', W / 2, 105, 40, '#ffffff', '#16223d', 9);
    text('starring Alvaro, the guy from the photo', W / 2, 142, 14, '#f4e9d8', '#16223d', 5);
    // pulsing chevrons above him
    const a = 0.45 + 0.45 * Math.sin(frames * 0.14);
    ctx.globalAlpha = a; ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#16223d'; ctx.lineWidth = 2.5;
    for (const dy of [0, 14]){
      ctx.beginPath();
      ctx.moveTo(guy.x - 11, guy.y - 66 + dy); ctx.lineTo(guy.x, guy.y - 78 + dy); ctx.lineTo(guy.x + 11, guy.y - 66 + dy);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(frames * 0.1);
    text('CLICK · TAP · SPACE to flap', W / 2, GY - 40, 17, '#ffffff', '#16223d', 6);
    ctx.globalAlpha = 1;
    if (best > 0) text('BEST: ' + best, W / 2, GY - 16, 13, '#f4e9d8', '#16223d', 4);
  }
  if (state === OVER){
    const p = Math.min(overT / 18, 1);
    const e = 1 - Math.pow(1 - p, 3);
    const pcx = W / 2, pcy = 250 + (1 - e) * -260;
    if (overT > 8){
      text('GAME OVER', pcx, pcy - 92, 40, '#ff8c42', '#5c2d12', 9);
      // panel
      ctx.fillStyle = '#e8dfb8'; ctx.strokeStyle = '#7d6a3a'; ctx.lineWidth = 3;
      rr(pcx - 145, pcy - 75, 290, 160, 10); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(125,106,58,0.5)'; ctx.lineWidth = 1.5;
      rr(pcx - 137, pcy - 67, 274, 144, 7); ctx.stroke();
      if (score >= 10) drawMedal(pcx - 90, pcy + 4, 30);
      else text('no medal', pcx - 88, pcy + 4, 13, '#8a7a50', null);
      text('SCORE', pcx + 40, pcy - 42, 15, '#8a7a50', null);
      text(String(score), pcx + 40, pcy - 16, 32, '#5c4d24', null);
      text('BEST', pcx + 40, pcy + 26, 15, '#8a7a50', null);
      text(String(best), pcx + 40, pcy + 52, 32, '#5c4d24', null);
      if (newBest) text('★ NEW BEST ★', pcx + 40, pcy + 82, 14, '#c0392b', null);
    }
    if (overT > 25 && Math.floor(frames / 22) % 2 === 0){
      text('CLICK · TAP · SPACE to retry', pcx, 408, 17, '#ffffff', '#16223d', 6);
    }
  }

  // hit flash
  if (flash > 0){
    ctx.globalAlpha = flash * 0.85;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
}

// ---------- input ----------
cvs.addEventListener('pointerdown', e => { e.preventDefault(); tap(); });
cvs.addEventListener('touchstart', e => { e.preventDefault(); if (!window.PointerEvent) tap(); }, { passive: false });
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW'){ e.preventDefault(); tap(); }
});

// ---------- main loop ----------
let last = performance.now();
function loop(now){
  const dtms = Math.min(now - last, 50); last = now;
  update(dtms / (1000 / 60));
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// debug handle for automated testing
window.__flappy = {
  tap: tap,
  step: n => { for (let i = 0; i < n; i++) update(1); },
  get state(){ return state; }, get score(){ return score; },
  get guyY(){ return guy.y; }
};
})();
</script>
</body>
